<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/terminal.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/common.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="logo">📈</div>Paper Trader</div>
    <nav class="accounts" id="accounts"></nav>
    <div class="right">
      <a href="/news">News</a><a href="/settings">Settings</a>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <aside class="card watchlist">
    <div class="card-head"><h2>Market Watch</h2><span class="muted" id="session" style="margin-left:auto;font-size:11.5px"></span></div>
    <div id="warnings"></div>
    <div class="card-body" id="wl"></div>
  </aside>

  <section class="card chartcard">
    <div class="chart-head">
      <span class="sym" id="c-sym"></span>
      <span class="last" id="c-last"></span>
      <span class="muted mono" id="c-spread"></span>
      <span class="seg" id="tf-seg"><button data-tf="5m">M5</button><button data-tf="15m">M15</button></span>
      <span class="toggles">
        <button class="toggle" data-opt="levels" title="Previous day / session highs & lows, liquidity pools">Levels</button>
        <button class="toggle" data-opt="zones" title="Fair value gaps and order blocks">FVG / OB</button>
        <button class="toggle" data-opt="positions" title="Entry, stop loss and take profit of open positions">Positions</button>
      </span>
    </div>
    <div class="chart-wrap"><div id="chart"></div><div id="zones"></div></div>
    <div class="chart-note" id="c-note"></div>
  </section>

  <section class="card bottom">
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div class="card-body" id="tab-body"></div>
  </section>

  <section class="card compare" id="compare">
    <div class="card-head"><h2>Compare accounts</h2><span class="muted">same live prices, four rule sets (Lab = takes every signal, for research)</span></div>
    <div class="card-body">
      <div class="cards" id="cmp-cards"></div>
      <div id="cmp-chart"></div>
      <p class="muted pad">Equity of each $250 account vs. holding BTC or gold with $250 (no leverage). Updated every 15 min.</p>
    </div>
  </section>
</div>

<script>
const LABEL = { standard: "Standard", moderate: "Moderate", aggressive: "Aggressive", lab: "Lab" };
const MODES = ["standard", "moderate", "aggressive", "lab"];
const TF_SEC = { "5m": 300, "15m": 900 };
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
let acc = (location.hash || "#standard").slice(1);
let sym = store.get("sym", "XAU_USD");
let tf = null, tab = store.get("tab", "trade");
const opts = JSON.parse(store.get("chartOpts", '{"levels":true,"zones":true,"positions":true}'));
let state = null, es = null, chart, series, cmpChart, lastBar = null, clockSkew = 0;
let posLines = [], levelLines = [], zonesData = [];

// ------------------------------------------------------------------ helpers
const f2 = (v) => (v == null ? "–" : Number(v).toFixed(2));
const px = (v, d) => (v == null ? "–" : Number(v).toFixed(d));
const sideTag = (s) => (s === "LONG" ? '<span class="chip ok">BUY</span>' : '<span class="chip bad">SELL</span>');
const mtTime = (iso) => { if (!iso) return "–"; const d = new Date(iso); return d.toISOString().slice(5, 16).replace("T", " "); };
const tfLabel = (t) => (t === "5m" ? "M5" : "M15");
const setText = (el, v) => { if (el && el.textContent !== v) el.textContent = v; };
const setCls = (el, c) => { if (el && el.className !== c) el.className = c; };
function flash(el, dir) { if (!el || !dir) return; el.classList.remove("flash-up", "flash-down"); void el.offsetWidth; el.classList.add(dir); }
// replace innerHTML only when it changed, keeping the scroll position (no flicker, no jump)
function patch(el, html, key) {
  if (el._html === html && el._key === key) return;
  const keep = el._key === key ? el.scrollTop : 0;
  el.innerHTML = html; el._html = html; el._key = key; el.scrollTop = keep;
}
setInterval(() => { const d = new Date();
  setText(document.getElementById("clock"), d.toUTCString().slice(17, 25) + " UTC · " +
    d.toLocaleTimeString([], { timeZone: "Asia/Karachi", hour: "2-digit", minute: "2-digit" }) + " PKT"); }, 1000);

// ------------------------------------------------------------------ accounts bar (built once, then patched)
function renderAccounts(accounts) {
  const nav = document.getElementById("accounts");
  if (!nav.childElementCount) {
    nav.innerHTML = MODES.map((m) => `<button class="acct" data-acc="${m}"><span class="dot"></span><span class="name">${LABEL[m]}</span>
        <span class="chip tf"></span><span class="eq"></span><span class="chg"></span></button>`).join("") +
      `<button class="acct" data-acc="compare"><span class="name">Compare</span></button>`;
    nav.querySelectorAll(".acct").forEach((b) => (b.onclick = () => selectAccount(b.dataset.acc)));
  }
  nav.querySelectorAll(".acct").forEach((b) => b.classList.toggle("active", b.dataset.acc === acc));
  for (const m of MODES) {
    const a = accounts[m]; if (!a) continue;
    const b = nav.querySelector(`[data-acc="${m}"]`);
    setCls(b.querySelector(".dot"), `dot ${a.status}`);
    b.title = a.status_reason || a.status;
    setText(b.querySelector(".tf"), tfLabel(a.timeframe));
    setText(b.querySelector(".eq"), f2(a.equity));
    const chg = b.querySelector(".chg");
    setText(chg, usd(a.pnl_today, true)); setCls(chg, `chg ${cls(a.pnl_today)}`);
  }
}

function selectAccount(a) {
  acc = a; location.hash = a;
  document.getElementById("app").classList.toggle("comparing", a === "compare");
  if (state) renderAccounts(state.accounts);
  if (a === "compare") { if (es) es.close(); loadCompare(); return; }
  tf = null;
  loadState().then(() => { loadChart(); renderTab(); });
  connectStream();
}

// ------------------------------------------------------------- market watch (rows built once)
const wlRows = {};
function renderWatchlist(quotes) {
  const wl = document.getElementById("wl");
  for (const [s, q] of Object.entries(quotes)) {
    let r = wlRows[s];
    if (!r) {
      const el = document.createElement("div");
      el.className = "wl-row"; el.onclick = () => selectSymbol(s);
      el.innerHTML = `<div class="wl-left"><div class="wl-sym"><span class="n"></span><span class="chip reg"></span></div>
          <div class="wl-sub"><span class="dot st"></span><span class="stx"></span><span class="chip risk"></span></div></div>
        <div class="wl-right wl-px"><div class="wl-bid"></div><div class="wl-sub"><span class="ask"></span><span class="spr faint"></span></div></div>`;
      wl.appendChild(el);
      r = wlRows[s] = { el, n: el.querySelector(".n"), reg: el.querySelector(".reg"), st: el.querySelector(".st"),
        stx: el.querySelector(".stx"), risk: el.querySelector(".risk"), bid: el.querySelector(".wl-bid"),
        ask: el.querySelector(".ask"), spr: el.querySelector(".spr"), last: null };
    }
    r.el.classList.toggle("sel", s === sym);
    setText(r.n, q.xm + (q.enabled ? "" : " · off"));
    const reg = q.regime ? q.regime.split(" ")[0] : "";
    setText(r.reg, reg); setCls(r.reg, `chip reg regime-${reg || "none"}`); r.reg.style.display = reg ? "" : "none";
    r.reg.title = q.regime || "";
    const status = !q.open ? "closed" : q.age != null && q.age < 30 ? "live" : "stale";
    setCls(r.st, `dot st ${status === "live" ? "" : status}`); setText(r.stx, status);
    if (q.min_lot_risk == null) r.risk.style.display = "none";
    else { r.risk.style.display = ""; setText(r.risk, `0.01 = ${q.min_lot_risk.toFixed(1)}%`);
      setCls(r.risk, `chip risk ${q.min_lot_risk <= 2 ? "good" : q.min_lot_risk <= 5 ? "high" : "bad"}`);
      r.risk.title = "Risk of 0.01 lot with this account's default stop"; }
    const bidTxt = px(q.bid, q.digits);
    if (r.bid.textContent !== bidTxt) {
      const dir = r.last == null || q.bid == null ? null : q.bid > r.last ? "flash-up" : q.bid < r.last ? "flash-down" : null;
      r.bid.textContent = bidTxt; flash(r.bid, dir); r.last = q.bid;
    }
    setText(r.ask, px(q.ask, q.digits)); setText(r.spr, q.spread == null ? "" : `${q.spread}`);
  }
  const q = quotes[sym];
  if (q) {
    setText(document.getElementById("c-last"), px(q.bid, q.digits));
    setText(document.getElementById("c-spread"), q.spread == null ? "" : `ask ${px(q.ask, q.digits)} · spread ${q.spread}`);
    setText(document.getElementById("c-note"), q.last_check ? `Last check (${LABEL[acc]}): ${q.last_check}` : "");
  }
}

function selectSymbol(s) { sym = s; store.set("sym", s); renderWatchlist(state.quotes); loadChart(); }

// ------------------------------------------------------------------- chart
function makeChart() {
  chart = LightweightCharts.createChart(document.getElementById("chart"), {
    layout: { background: { color: "transparent" }, textColor: "#8790a3", fontFamily: "Inter, sans-serif" },
    grid: { vertLines: { color: "rgba(255,255,255,.03)" }, horzLines: { color: "rgba(255,255,255,.03)" } },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: "#232a38", rightOffset: 6 },
    rightPriceScale: { borderColor: "#232a38" },
    crosshair: { mode: 0, vertLine: { color: "#3a4458", labelBackgroundColor: "#252c3c" }, horzLine: { color: "#3a4458", labelBackgroundColor: "#252c3c" } },
    autoSize: true,
  });
  series = chart.addCandlestickSeries({ upColor: "#22ab94", downColor: "#f23645", borderVisible: false,
    wickUpColor: "#22ab94", wickDownColor: "#f23645" });
  chart.timeScale().subscribeVisibleLogicalRangeChange(() => drawZones());
  document.querySelectorAll("#tf-seg button").forEach((b) => (b.onclick = () => { tf = b.dataset.tf; loadChart(); }));
  document.querySelectorAll(".toggle").forEach((b) => {
    b.classList.toggle("on", !!opts[b.dataset.opt]);
    b.onclick = () => { opts[b.dataset.opt] = !opts[b.dataset.opt]; b.classList.toggle("on", opts[b.dataset.opt]);
      store.set("chartOpts", JSON.stringify(opts)); drawOverlays(); };
  });
  setInterval(drawZones, 250);    // follows price-scale autoscaling; only moves a few divs
}

async function loadChart() {
  if (!state) return;
  tf = tf || state.account.timeframe;
  document.querySelectorAll("#tf-seg button").forEach((b) => b.classList.toggle("on", b.dataset.tf === tf));
  const q = state.quotes[sym];
  setText(document.getElementById("c-sym"), `${q.xm} · ${tfLabel(tf)}`);
  const [rows, lv] = await Promise.all([api(`/api/candles?symbol=${sym}&tf=${tf}&n=500`), api(`/api/levels?symbol=${sym}&tf=${tf}`)]);
  series.applyOptions({ priceFormat: { type: "price", precision: q.digits, minMove: Math.pow(10, -q.digits) } });
  const data = rows.map((r) => ({ time: r.t, open: r.o, high: r.h, low: r.l, close: r.c }));
  series.setData(data);
  lastBar = data.length ? { ...data[data.length - 1] } : null;
  zonesData = lv.zones; state.levels = lv.levels;
  drawOverlays();
}

// every minute: pull the last few closed candles from the server and update in place (no reload, no jump)
async function refreshCandles() {
  if (!state || acc === "compare" || !tf) return;
  const rows = await api(`/api/candles?symbol=${sym}&tf=${tf}&n=3`);
  rows.forEach((r) => { if (!lastBar || r.t >= lastBar.time - TF_SEC[tf]) series.update({ time: r.t, open: r.o, high: r.h, low: r.l, close: r.c }); });
  if (rows.length) { const r = rows[rows.length - 1]; if (!lastBar || r.t >= lastBar.time) lastBar = { time: r.t, open: r.o, high: r.h, low: r.l, close: r.c }; }
  const lv = await api(`/api/levels?symbol=${sym}&tf=${tf}`);
  zonesData = lv.zones; state.levels = lv.levels; drawOverlays();
}

function tickChart(q) {
  if (!lastBar || !q || q.bid == null || q.ask == null || !q.open) return;
  const mid = (q.bid + q.ask) / 2, sec = TF_SEC[tf];
  const now = Math.floor(Date.now() / 1000 + clockSkew);
  if (now >= lastBar.time + sec) lastBar = { time: now - (now % sec), open: mid, high: mid, low: mid, close: mid };
  else { lastBar.close = mid; lastBar.high = Math.max(lastBar.high, mid); lastBar.low = Math.min(lastBar.low, mid); }
  series.update(lastBar);
}

function drawOverlays() {
  posLines.forEach((l) => series.removePriceLine(l)); posLines = [];
  levelLines.forEach((l) => series.removePriceLine(l)); levelLines = [];
  if (opts.positions) (state.positions || []).filter((p) => p.symbol === sym).forEach((p) => {
    const lbl = `#${p.id} ${p.side === "LONG" ? "BUY" : "SELL"} ${p.lots.toFixed(2)}`;
    posLines.push(series.createPriceLine({ price: p.entry, color: "#8790a3", lineWidth: 1, lineStyle: 0, title: lbl }));
    posLines.push(series.createPriceLine({ price: p.stop, color: "#f23645", lineWidth: 1, lineStyle: 2, title: "SL" }));
    posLines.push(series.createPriceLine({ price: p.target, color: "#22ab94", lineWidth: 1, lineStyle: 2, title: "TP" }));
  });
  if (opts.levels) (state.levels || []).forEach((lv) => {
    const strong = /^(PD|equal)/.test(lv.name), session = /(Asian|London|New York)/.test(lv.name);
    if (!strong && !session && lv.swept) return;            // swept minor swings: noise
    const color = lv.swept ? "rgba(135,144,163,.35)" : strong ? "#c9a227" : session ? "#7fb0ff" : "rgba(135,144,163,.6)";
    const short = lv.name.replace("New York", "NY").replace(" high", " H").replace(" low", " L").replace("swing", "sw")
                         .replace("equal highs", "EQH").replace("equal lows", "EQL");
    levelLines.push(series.createPriceLine({ price: lv.price, color, lineWidth: 1, lineStyle: lv.swept ? 1 : strong ? 0 : 2,
      axisLabelVisible: strong && !lv.swept, title: short + (lv.swept ? " ✓" : "") }));
  });
  drawZones();
}

const zoneEls = [];
function drawZones() {
  const box = document.getElementById("zones");
  // fresh (untouched) zones only, the 2 nearest to price above and below - touched ones are mostly spent
  let show = [];
  if (opts.zones && acc !== "compare" && lastBar) {
    const p = lastBar.close, fresh = zonesData.filter((z) => !z.touched);
    const above = fresh.filter((z) => z.bottom > p).sort((a, b) => a.bottom - b.bottom).slice(0, 2);
    const below = fresh.filter((z) => z.top <= p).sort((a, b) => b.top - a.top).slice(0, 2);
    show = [...above, ...below];
  }
  const width = box.clientWidth - chart.priceScale("right").width();
  show.forEach((z, i) => {
    let el = zoneEls[i];
    if (!el) { el = document.createElement("div"); el.innerHTML = "<span></span>"; box.appendChild(el); zoneEls[i] = el; }
    const yTop = series.priceToCoordinate(z.top), yBot = series.priceToCoordinate(z.bottom);
    let x = chart.timeScale().timeToCoordinate(z.t);
    if (x == null) { const r = chart.timeScale().getVisibleRange(); x = r && z.t < r.from ? 0 : null; }
    if (yTop == null || yBot == null || x == null) { el.style.display = "none"; return; }
    setCls(el, `zone ${z.kind} ${z.side}`);
    el.style.display = ""; el.style.left = `${Math.max(0, x)}px`; el.style.width = `${Math.max(0, width - Math.max(0, x))}px`;
    el.style.top = `${Math.min(yTop, yBot)}px`; el.style.height = `${Math.max(2, Math.abs(yBot - yTop))}px`;
    setText(el.firstChild, Math.abs(yBot - yTop) >= 12 ? (z.kind === "fvg" ? "FVG" : "OB") : "");
  });
  for (let i = show.length; i < zoneEls.length; i++) zoneEls[i].style.display = "none";
}

// ------------------------------------------------------------- account stats strip
function renderStats(a) {
  const el = document.getElementById("stats");
  const items = [["Balance", "bal"], ["Equity", "eq"], ["Margin", "mg"], ["Free margin", "fm"], ["Margin level", "ml"],
                 ["Today", "td"], ["Since start", "tot"], ["Status", "st"]];
  if (!el.childElementCount) el.innerHTML = items.map(([k, id]) => `<div class="stat"><div class="k">${k}</div><div class="v" id="s-${id}"></div></div>`).join("");
  const set = (id, v, c = "v") => { const e = document.getElementById(`s-${id}`); setText(e, v); setCls(e, c); };
  set("bal", f2(a.balance)); set("eq", f2(a.equity)); set("mg", f2(a.margin)); set("fm", f2(a.free_margin));
  set("ml", a.margin_level == null ? "–" : a.margin_level.toFixed(0) + "%");
  set("td", usd(a.pnl_today, true), `v ${cls(a.pnl_today)}`);
  set("tot", `${usd(a.pnl_total, true)} (${pct(100 * a.pnl_total / a.starting_balance)})`, `v ${cls(a.pnl_total)}`);
  set("st", a.status.replace("_", " "), `v ${a.status === "active" ? "up" : a.status === "halted" ? "down" : "warn"}`);
  document.getElementById("s-st").title = a.status_reason || "";
}

// ----------------------------------------------------------------- tabs
const TABS = [["trade", "Positions"], ["history", "History"], ["journal", "Journal"], ["scorecard", "Scorecard"],
              ["learning", "Learning"], ["research", "Research"], ["playbook", "Playbook"], ["ai", "AI & budget"],
              ["controls", "Account"]];

function renderTabsBar() {
  const el = document.getElementById("tabs");
  if (!el.childElementCount) {
    el.innerHTML = TABS.map(([k, t]) => `<span class="tab" data-tab="${k}">${t}<span class="count"></span></span>`).join("");
    el.querySelectorAll(".tab").forEach((t) => (t.onclick = () => { tab = t.dataset.tab; store.set("tab", tab); renderTab(); }));
  }
  el.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === tab));
  setText(el.querySelector('[data-tab="trade"] .count'), state && state.positions.length ? String(state.positions.length) : "");
}

async function renderTab() {
  renderTabsBar();
  const body = document.getElementById("tab-body");
  const views = { trade: async () => tradeTable(), history: historyTable, journal: journalTable, scorecard: scorecardTable,
                  playbook: playbookView, learning: learningView, research: researchView, ai: async () => aiView(),
                  controls: async () => controlsView() };
  const t = tab, a = acc;
  const html = await (views[t] || views.trade)();
  if (t === tab && a === acc) patch(body, html, `${a}:${t}`);
}

function tradeTable() {
  const rows = state.positions;
  if (!rows.length) return '<div class="empty">No open positions in this account.</div>';
  return `<table><tr><th>Symbol</th><th>Ticket</th><th>Time</th><th>Type</th><th class="num">Volume</th><th class="num">Price</th>
    <th class="num">S / L</th><th class="num">T / P</th><th class="num">Current</th><th class="num">Swap</th><th class="num">Profit</th><th>Reason</th><th></th></tr>` +
    rows.map((p) => `<tr><td><b>${p.xm}</b></td><td class="num">${p.id}</td><td class="num">${mtTime(p.opened_at)}</td><td>${sideTag(p.side)}</td>
      <td class="num">${p.lots.toFixed(2)}</td><td class="num">${px(p.entry, p.digits)}</td><td class="num">${px(p.stop, p.digits)}</td>
      <td class="num">${px(p.target, p.digits)}</td><td class="num" id="px-${p.id}">${px(p.price, p.digits)}</td><td class="num">${f2(p.swap)}</td>
      <td class="num ${cls(p.profit)}" id="pf-${p.id}">${f2(p.profit)}</td><td class="wrap">${esc(p.signal)}: ${esc(p.ai_reason)}</td>
      <td><button class="small ghost" onclick="closePos(${p.id})" title="Close at market">✕</button></td></tr>`).join("") + "</table>";
}

async function historyTable() {
  const rows = await api(`/api/trades?account=${acc}&limit=200`);
  if (!rows.length) return '<div class="empty">No closed trades yet.</div>';
  const d = (s) => (state.quotes[s] ? state.quotes[s].digits : 5);
  const total = rows.reduce((s, t) => s + t.pnl_usd, 0);
  return `<table><tr><th>Opened</th><th>Symbol</th><th>Type</th><th class="num">Volume</th><th class="num">Entry</th><th class="num">S / L</th>
    <th class="num">T / P</th><th>Closed</th><th class="num">Exit</th><th class="num">Swap</th><th class="num">Profit</th><th class="num">R</th><th>Exit reason</th><th>Strategy · AI</th></tr>` +
    rows.map((t) => `<tr><td class="num">${mtTime(t.opened_at)}</td><td><b>${state.quotes[t.symbol]?.xm || t.symbol}</b></td><td>${sideTag(t.side)}</td>
      <td class="num">${t.lots.toFixed(2)}</td><td class="num">${px(t.entry, d(t.symbol))}</td><td class="num">${px(t.stop, d(t.symbol))}</td>
      <td class="num">${px(t.target, d(t.symbol))}</td><td class="num">${mtTime(t.closed_at)}</td><td class="num">${px(t.exit, d(t.symbol))}</td>
      <td class="num">${f2(t.swap)}</td><td class="num ${cls(t.pnl_usd)}">${f2(t.pnl_usd)}</td>
      <td class="num ${cls(t.pnl_r)}">${t.pnl_r == null ? "–" : t.pnl_r.toFixed(2)}</td><td>${esc(t.exit_reason)}</td>
      <td class="wrap">${esc(t.signal)}${t.regime ? " · " + esc(t.regime) : ""}: ${esc(t.ai_reason)}</td></tr>`).join("") +
    `<tr><td colspan="10" class="muted">${rows.length} trades</td><td class="num ${cls(total)}"><b>${f2(total)}</b></td><td colspan="3"></td></tr></table>`;
}

async function journalTable() {
  const rows = await api(`/api/decisions?account=${acc}&limit=150`);
  if (!rows.length) return `<div class="empty">No signals yet. The engine checks every closed ${tfLabel(state.account.timeframe)} candle.</div>`;
  const ai = (r) => { if (!r.ai_used) return `<span class="faint">${r.accepted ? "rules only" : "–"}</span>`;
    return (r.ai_reply || "").includes('"sonnet"') ? '<span class="chip ok">Haiku + Sonnet</span>' : '<span class="chip">Haiku</span>'; };
  return `<table><tr><th>Time</th><th>Symbol</th><th>Type</th><th>Strategy</th><th>Regime</th><th>AI</th><th>Result</th><th>Why the signal fired</th></tr>` +
    rows.map((r) => `<tr><td class="num">${mtTime(r.at)}</td><td>${state.quotes[r.symbol]?.xm || r.symbol}</td><td>${sideTag(r.side)}</td>
      <td>${r.signal}</td><td>${r.regime ? `<span class="chip regime-${r.regime}">${r.regime}</span>` : ""}</td><td>${ai(r)}</td>
      <td class="wrap" style="color:${r.accepted ? "var(--up)" : ""}">${r.accepted ? "OPENED" + (r.reject_reason ? " · " + esc(r.reject_reason) : "") : esc(r.reject_reason)}</td>
      <td class="wrap">${esc(r.signal_note)}</td></tr>`).join("") + "</table>";
}

async function scorecardTable() {

    <td class="num">${r.n}</td><td class="num">${(100 * r.win_rate).toFixed(0)}%</td><td class="num ${cls(r.avg_r)}">${(r.avg_r || 0).toFixed(2)}</td>

async function learningView() {
  const L = await api(`/api/learning?account=${acc}`);
  const statusCls = { active: "good", cautious: "high", probation: "high", off: "bad" };
  const regimes = Object.values(L.regimes).map((r) => `<span class="chip regime-${r.regime || "none"}" title="${esc(r.detail)}">${r.xm}: ${r.regime || "–"}</span>`).join(" ");
  const states = L.states.length ? L.states.map((s) => `<tr><td>${s.signal}</td><td><span class="chip regime-${s.regime}">${s.regime}</span></td>
      <td><span class="chip ${statusCls[s.status] || ""}">${s.status}</span></td><td class="num">${s.risk_mult === 1 ? "full" : s.risk_mult === 0 ? "–" : "×" + s.risk_mult}</td>
      <td class="num">${s.n}</td><td class="num ${cls(s.avg_r)}">${s.avg_r == null ? "–" : s.avg_r.toFixed(2)}</td>
      <td class="wrap">${esc(s.reason)}${s.until ? " · until " + mtTime(s.until) : ""}</td>
      <td>${s.status !== "active" ? `<button class="small" onclick="resetStrategy('${s.signal}','${s.regime}')">Reset</button>` : ""}</td></tr>`).join("")
    : '<tr><td colspan="8" class="empty">No closed trades yet. Each strategy is judged per market regime once it has trades.</td></tr>';
  const runs = L.tuning.length ? L.tuning.map((r) => { const res = r.result || {};
      const fmt = (p) => p ? `stop ${p.default_stop_atr} · target ${p.default_target_atr} · BE ${p.breakeven_at_r || "off"}` : "–";
      const t = (m) => m ? `${m.total_r >= 0 ? "+" : ""}${m.total_r}R / ${m.trades}` : "–";
      return `<tr><td class="num">${mtTime(r.at)}</td><td><span class="chip ${r.applied ? "good" : ""}">${r.applied ? "applied" : "kept"}</span></td>
        <td>${fmt(r.current)}</td><td>${fmt(r.best)}</td><td class="num">${t(res.train_best)}</td>
        <td class="num">${t(res.test_current)}</td><td class="num">${t(res.test_best)}</td><td class="wrap">${esc(r.reason)}</td></tr>`; }).join("")
    : '<tr><td colspan="8" class="empty">No tuning runs yet. It runs every Saturday 06:00 UTC, or press "Run tuner now".</td></tr>';
  const e = L.exits;
  return `<div class="pad">
    <p class="muted" style="margin:0 0 10px;max-width:900px">Every trade is tagged with its strategy and the market regime. Strategies that lose in a regime are
      switched off there (then retried on probation at half risk); weak ones trade at half risk. Every Saturday the tuner tests nearby
      stop/target settings and only applies them if they also win on newer data.</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b>Regime now (${tfLabel(L.timeframe)})</b> ${regimes}</div>
    <div style="margin-top:8px" class="muted">Exits: stop ${e.default_stop_atr} ATR · target ${e.default_target_atr} ATR · breakeven ${e.breakeven_at_r || "off"}
      · switching ${L.adaptive.enabled ? "on" : "off"} · auto-tune ${L.adaptive.auto_tune ? "on" : "off"}
      <button class="small" style="margin-left:8px" onclick="runTuner()" ${L.tuning_running ? "disabled" : ""}>${L.tuning_running ? "Tuning…" : "Run tuner now"}</button></div>
    <div class="section-title">What skipped signals would have done (last 30 days)</div>
    <p class="muted" style="margin:0 0 6px;max-width:900px">Every signal the bot skipped is followed until it would have hit its stop or
      target (or 48h pass). A skip reason with a negative total is <b>saving money</b>; a positive total means it is
      <b>blocking winners</b> and may be too strict. Includes the XM spread.</p>
    <table><tr><th>Skip reason</th><th class="num">Skipped</th><th class="num">Would have won</th><th class="num">Would have lost</th>
      <th class="num">Total R</th><th class="num">Avg R</th><th>Verdict</th></tr>
      ${L.skips.length ? L.skips.map((c) => `<tr><td>${esc(c.category)}</td><td class="num">${c.n}</td><td class="num">${c.wins}</td>
        <td class="num">${c.losses}</td><td class="num ${cls(c.total_r)}">${c.total_r >= 0 ? "+" : ""}${c.total_r}</td>
        <td class="num ${cls(c.avg_r)}">${c.avg_r.toFixed(2)}</td>
        <td><span class="chip ${c.verdict === "saving money" ? "good" : c.verdict === "costing winners" ? "bad" : ""}">${c.verdict}</span></td></tr>`).join("")
        : '<tr><td colspan="7" class="empty">Nothing resolved yet: outcomes appear about 2 days after a skip.</td></tr>'}</table>
    <div class="section-title">Strategies by regime</div>
    <table><tr><th>Strategy</th><th>Regime</th><th>Status</th><th class="num">Risk</th><th class="num">Trades</th><th class="num">Avg R</th><th>Why</th><th></th></tr>${states}</table>
    <div class="section-title">Tuning runs (walk-forward)</div>
    <table><tr><th>When</th><th>Result</th><th>Before</th><th>Best found</th><th class="num">Train best</th><th class="num">Test: current</th><th class="num">Test: best</th><th>Why</th></tr>${runs}</table>
  </div>`;
}

async function researchView() {
  const R = await api("/api/research");
  const rev = R.review;
  const review = rev ? `<div class="mcard" style="margin-bottom:12px"><div class="muted" style="font-size:11.5px">${mtTime(rev.at)} · ${rev.model.includes("sonnet") ? "Sonnet" : "Haiku"}</div>
      <p style="margin:6px 0">${esc(rev.summary)}</p>
      ${rev.recommendations.length ? `<b>Recommendations</b><ul style="margin:4px 0 8px">${rev.recommendations.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${rev.risks.length ? `<b>Risks</b><ul style="margin:4px 0">${rev.risks.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`
    : '<div class="empty">No research review yet. It runs every Sunday 04:00 UTC, or press "Run research now".</div>';
  const props = R.proposals.length ? R.proposals.map((p) => {
      const bt = p.evidence && p.evidence.backtest;
      return `<tr><td class="num">${mtTime(p.at)}</td><td>${LABEL[p.account] || p.account}</td>
        <td><span class="chip ${p.action === "add" ? "good" : "bad"}">${p.action}</span> <b>${esc(p.item)}</b></td>
        <td class="wrap">${esc(p.reason)}${bt ? ` · 2y: $250 → $${bt.equity}, max DD ${bt.max_dd_pct}%` : ""}</td>
        <td>${p.status === "pending" ? `<button class="small" onclick="decide(${p.id},'approve')">Approve</button>
          <button class="small ghost" onclick="decide(${p.id},'reject')">Reject</button>` : `<span class="chip">${p.status}</span>`}</td></tr>`; }).join("")
    : '<tr><td colspan="5" class="empty">No proposals yet.</td></tr>';
  const lab = R.lab.length ? R.lab.map((r) => `<tr><td>${state.quotes[r.symbol]?.xm || r.symbol}</td><td>${r.signal}</td>
      <td class="num">${r.n}</td><td class="num">${r.n ? Math.round(100 * r.wins / r.n) : 0}%</td>
      <td class="num ${cls(r.avg_r)}">${r.avg_r == null ? "–" : r.avg_r.toFixed(2)}</td><td class="num ${cls(r.total_r)}">${r.total_r}</td></tr>`).join("")
    : '<tr><td colspan="6" class="empty">The Lab has no closed trades yet.</td></tr>';
  const allow = Object.entries(R.allowlists).map(([m, a]) => `<div><b>${LABEL[m]}</b>: ${a.length ? a.map((x) => `<span class="chip">${esc(x)}</span>`).join(" ") : '<span class="muted">everything</span>'}</div>`).join("");
  return `<div class="pad">
    <p class="muted" style="margin:0 0 10px;max-width:900px">Every Sunday the bot looks at the Lab's live results. Pairs doing well are re-tested on
      2 years of history under each account's rules; the ones that make money in <b>both</b> years are proposed for that account.
      Allowlisted pairs that lose live are proposed for removal. Nothing changes until you approve.
      <button class="small" style="margin-left:6px" onclick="runResearch()" ${R.running ? "disabled" : ""}>${R.running ? "Running…" : "Run research now"}</button></p>
    <div class="section-title" style="margin-top:0">Weekly research review</div>${review}
    <div class="section-title">Allowlist proposals</div>
    <table><tr><th>When</th><th>Account</th><th>Change</th><th>Evidence</th><th></th></tr>${props}</table>
    <div class="section-title">Lab league table (last 60 days)</div>
    <table><tr><th>Symbol</th><th>Strategy</th><th class="num">Trades</th><th class="num">Win %</th><th class="num">Avg R</th><th class="num">Total R</th></tr>${lab}</table>
    <div class="section-title">Current allowlists</div><div style="display:grid;gap:6px">${allow}</div>
  </div>`;
}
async function decide(id, action) {
  if (!confirm(`${action === "approve" ? "Approve" : "Reject"} proposal #${id}?`)) return;
  try { await api(`/api/proposals/${id}/${action}`, { method: "POST" }); toast(action === "approve" ? "Approved: allowlist updated" : "Rejected"); renderTab(); }
  catch (e) { toast("Error: " + e.message); }
}
async function runResearch() {
  const r = await api("/api/research/run", { method: "POST" });
  toast(r.started ? "Research started: 2-year tests take a few minutes each" : r.reason);
  setTimeout(renderTab, 1500);
}

async function resetStrategy(signal, regime) {
  if (!confirm(`Reset ${signal} in ${regime} markets back to active?`)) return;
  await api("/api/learning/reset", { method: "POST", body: { account: acc, signal, regime } }); renderTab();
}
async function runTuner() {
  const r = await api(`/api/tune/${acc}`, { method: "POST" });
  toast(r.started ? "Tuner started: takes a few minutes; results appear here" : r.reason);
  setTimeout(renderTab, 1500);
}

    ${b.by_purpose.map((p) => `<tr><td>${p.purpose}</td><td>${(p.model || "").includes("sonnet") ? "Sonnet" : "Haiku"}</td><td class="num">${p.calls}</td><td class="num">${p.tin}</td><td class="num">${p.tout}</td><td class="num">$${(p.cost || 0).toFixed(4)}</td></tr>`).join("")}</table></div>`;

  const a = state.account;
  return `<div class="pad"><p><b>${esc(a.label)}</b> · status <b>${a.status}</b> <span class="muted">${esc(a.status_reason || "")}</span></p>
    <div class="actions">
      <button onclick="control('pause')">⏸ Pause</button><button onclick="control('resume')">▶ Resume</button>

      <button class="danger" onclick="control('kill','KILL SWITCH: close everything in this account and halt it?')">🛑 Kill switch</button>

// -------------------------------------------------------------- actions
async function control(action, confirmMsg) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  try { const r = await api(`/api/control/${action}?account=${acc}`, { method: "POST", body: {} }); toast(`${action}: ${JSON.stringify(r)}`); await loadState(); renderTab(); }
  catch (e) { toast("Error: " + e.message); }
}
async function closePos(id) {
  if (!confirm(`Close #${id} at market?`)) return;
  await api(`/api/control/close_position?account=${acc}`, { method: "POST", body: { id } }); await loadState(); renderTab(); drawOverlays();
}
async function enableSignal(symbol, signal) { await api("/api/scorecard/enable", { method: "POST", body: { account: acc, symbol, signal } }); renderTab(); }
async function editPlaybook() {
  const cur = document.getElementById("pb").textContent;
  const text = prompt(`Edit the ${LABEL[acc]} playbook:`, cur);
  if (text && text !== cur) { await api("/api/playbook", { method: "PUT", body: { mode: acc, content: text } }); renderTab(); toast("Playbook saved"); }
}
async function rollbackPb(id) { if (confirm("Roll back playbook?")) { await api(`/api/playbook/rollback/${id}`, { method: "POST" }); renderTab(); } }

// ----------------------------------------------------------- data loading
function renderAll() {
  patch(document.getElementById("warnings"), state.config_warnings.map((w) => `<div class="alert">⚠ ${esc(w)}</div>`).join(""), "w");
  renderAccounts(state.accounts); renderWatchlist(state.quotes); renderStats(state.account); renderTabsBar();
  setText(document.getElementById("session"), state.session);
}

async function loadState() {
  const levels = state && state.levels;
  state = await api(`/api/state?account=${acc}`);
  state.levels = levels;
  renderAll();
}

// SSE: updates arrive every second; coalesce into one render per animation frame
let pending = null;
function connectStream() {
  if (es) es.close();
  if (acc === "compare") return;
  es = new EventSource(`/api/stream?account=${acc}`);
  es.onmessage = (e) => {
    const was = pending; pending = JSON.parse(e.data);
    if (!was) requestAnimationFrame(applyUpdate);
  };
  es.onerror = () => { es.close(); setTimeout(connectStream, 5000); };
}

function applyUpdate() {
  const d = pending; pending = null;
  if (!d || !state) return;
  if (d.ts) clockSkew = d.ts - Date.now() / 1000;
  state.quotes = d.quotes; state.account = d.account; state.accounts = d.accounts;
  renderWatchlist(d.quotes); renderAccounts(d.accounts); renderStats(d.account); tickChart(d.quotes[sym]);
  let changed = d.positions.length !== state.positions.length;
  d.positions.forEach((p) => {
    const old = state.positions.find((x) => x.id === p.id);
    if (!old) { changed = true; return; }
    if (old.stop !== p.stop) changed = true;
    Object.assign(old, p);
    const pxEl = document.getElementById(`px-${p.id}`), pf = document.getElementById(`pf-${p.id}`);
    setText(pxEl, px(p.price, old.digits));
    if (pf) { setText(pf, f2(p.profit)); setCls(pf, "num " + cls(p.profit)); }
  });
  if (changed) loadState().then(() => { drawOverlays(); if (tab === "trade" || tab === "history") renderTab(); });
}

// --------------------------------------------------------------- compare
async function loadCompare() {
  const [rows, eq] = await Promise.all([api("/api/compare"), api("/api/equity?days=120")]);
  renderAccounts(Object.fromEntries(rows.map((r) => [r.id, r])));
  patch(document.getElementById("cmp-cards"), rows.map((r) => `<div class="mcard">
    <h3><span class="dot ${r.status}"></span>${esc(r.label)} <span class="chip">${tfLabel(r.timeframe)}</span> <span class="muted" style="font-weight:400">${r.status.replace("_", " ")}</span></h3>
    <div class="big ${cls(r.pnl_total)}">${f2(r.equity)} <span style="font-size:13px">${pct(100 * r.pnl_total / r.starting_balance)}</span></div>
    <div class="kv"><span>Trades</span><span>${r.trades}</span><span>Win rate</span><span>${r.win_rate == null ? "–" : (100 * r.win_rate).toFixed(0) + "%"}</span>
    <span>Avg R</span><span class="${cls(r.avg_r)}">${r.avg_r == null ? "–" : r.avg_r.toFixed(2)}</span>
    <span>Avg per day</span><span class="${cls(r.avg_daily_pct)}">${r.avg_daily_pct == null ? "–" : r.avg_daily_pct.toFixed(2) + "%"}</span>
    <span>Max drawdown</span><span>${r.max_drawdown_pct.toFixed(1)}%</span><span>Best / worst</span><span>${f2(r.best)} / ${f2(r.worst)}</span>
    <span>Days running</span><span>${r.days.toFixed(1)}</span></div></div>`).join(""), "cmp");
  const el = document.getElementById("cmp-chart");
  if (cmpChart) cmpChart.remove();
  cmpChart = LightweightCharts.createChart(el, { layout: { background: { color: "transparent" }, textColor: "#8790a3", fontFamily: "Inter, sans-serif" },
    grid: { vertLines: { color: "rgba(255,255,255,.03)" }, horzLines: { color: "rgba(255,255,255,.03)" } },
    timeScale: { timeVisible: true, borderColor: "#232a38" }, rightPriceScale: { borderColor: "#232a38" }, autoSize: true });
  const colors = { standard: "#3b82f6", moderate: "#a78bfa", aggressive: "#f59e0b", lab: "#64748b" };
  const t = (iso) => Math.floor(new Date(iso).getTime() / 1000);
  for (const m of MODES) {
    const s = cmpChart.addLineSeries({ color: colors[m], lineWidth: 2, title: LABEL[m] });
    s.setData(eq.filter((r) => r.account === m).map((r) => ({ time: t(r.at), value: r.equity })));
  }
  const base = eq.filter((r) => r.account === "standard");
  cmpChart.addLineSeries({ color: "#8790a3", lineWidth: 1, lineStyle: 2, title: "BTC hold" })
    .setData(base.filter((r) => r.btc_benchmark).map((r) => ({ time: t(r.at), value: r.btc_benchmark })));
  cmpChart.addLineSeries({ color: "#c9a227", lineWidth: 1, lineStyle: 1, title: "Gold hold" })
    .setData(base.filter((r) => r.gold_benchmark).map((r) => ({ time: t(r.at), value: r.gold_benchmark })));
  cmpChart.timeScale().fitContent();
}

// ------------------------------------------------------------------ start
makeChart();
selectAccount([...MODES, "compare"].includes(acc) ? acc : "standard");
setInterval(() => { if (acc !== "compare") { loadState(); if (["journal", "scorecard", "ai", "learning", "history", "research"].includes(tab)) renderTab(); } }, 30000);
setInterval(() => refreshCandles().catch(() => {}), 60000);
setInterval(() => { if (acc === "compare") loadCompare(); }, 60000);
</script>
